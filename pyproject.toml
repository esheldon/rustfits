[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rustfits"
# Version is the single source of truth in Cargo.toml; maturin reads it
# from there because "version" is declared dynamic below.
dynamic = ["version"]
description = "A Python FITS library with the heavy lifting written in Rust."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/esheldon/rustfits"
Repository = "https://github.com/esheldon/rustfits"

[tool.maturin]
module-name = "rustfits._rust"
