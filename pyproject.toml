[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rustfits"
version = "0.1.0"
description = "A simple Python package demonstrating a Rust extension with PyO3."
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}

[tool.maturin]
module-name = "rustfits._rust"
